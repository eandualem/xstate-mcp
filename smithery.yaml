startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      wsPort:
        type: number
        default: 7357
        description: WebSocket server port for receiving XState inspection events
      bufferSize:
        type: number
        default: 100
        description: Max events per actor in ring buffer
      logLevel:
        type: string
        default: info
        enum: [debug, info, warn, error]
        description: Logging verbosity
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js'],
      env: {
        XSTATE_MCP_WS_PORT: String(config.wsPort ?? 7357),
        XSTATE_MCP_BUFFER_SIZE: String(config.bufferSize ?? 100),
        XSTATE_MCP_LOG_LEVEL: config.logLevel ?? 'info',
      },
    })
